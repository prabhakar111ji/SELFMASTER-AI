# ==========================================
# SELFMASTER AI - PRODUCTION Configuration
# ==========================================

# Use environment variables injected by the Cloud Provider

# ---- Server ----
server.port=${PORT:8080}
server.servlet.context-path=/

# ---- MySQL Database ----
# Example Format: jdbc:mysql://hostname:3306/dbname
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ---- JPA / Hibernate ----
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# ---- JWT ----
# Should be overridden in production via Env Var
app.jwt.secret=${JWT_SECRET:SelfMasterAI2024SuperSecretKeyForJWTTokenGenerationAndValidation256Bit!!}
app.jwt.expiration-ms=86400000
app.jwt.refresh-expiration-ms=604800000

# ---- OpenAI ----
app.openai.api-key=${OPENAI_API_KEY}
app.openai.model=gpt-4o-mini
app.openai.max-tokens=2000
app.openai.temperature=0.7
app.openai.base-url=https://api.openai.com/v1

# ---- Email (SMTP) ----
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:noreply@selfmaster.ai}
spring.mail.password=${MAIL_PASSWORD:password}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# ---- File Upload ----
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB

# ---- Logging ----
logging.level.root=INFO
logging.level.com.selfmaster=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
